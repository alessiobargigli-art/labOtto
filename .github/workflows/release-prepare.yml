name: Prepare LAB-8 1.0 release

on:
  push:
    branches: [release/lab8-1.0]

permissions:
  contents: write

jobs:
  patch-game:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lab8-1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded 1.0 gameplay integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text()

          replacements = [
            ("  speedIndex: CONFIG.initialSpeedIndex,", "  speedIndex: globalThis.Lab8Settings?.initialSpeedIndex?.() ?? CONFIG.initialSpeedIndex,"),
            ("  state.speedIndex = CONFIG.initialSpeedIndex;", "  state.speedIndex = globalThis.Lab8Settings?.initialSpeedIndex?.() ?? CONFIG.initialSpeedIndex;"),
            ("  localStorage.setItem('lab8.best', String(state.best));\n  state.flash = 0.25;", "  localStorage.setItem('lab8.best', String(state.best));\n  const finalScore = Math.floor(state.score);\n  globalThis.Lab8Leaderboard?.recordScore?.(finalScore, `${Date.now()}-${finalScore}`);\n  state.flash = 0.25;"),
            ("function update(dt) {\n  state.flash = Math.max(0, state.flash - dt);", "function update(dt) {\n  if (globalThis.Lab8Pin?.blocksGameplay?.() || globalThis.Lab8Settings?.blocksGameplay?.() || globalThis.Lab8Leaderboard?.blocksGameplay?.()) return;\n  state.flash = Math.max(0, state.flash - dt);"),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
            s = s.replace(old, new, 1)

          marker = "if ('serviceWorker' in navigator) {"
          if marker not in s:
            raise SystemExit('service worker marker not found')

          if 'globalThis.Lab8Game = {' not in s:
            s += "\n\nglobalThis.Lab8Game = {\n  applyInitialSpeed(index) {\n    if (state.mode === MODES.RUNNER && state.score === 0) state.speedIndex = Math.max(0, Math.min(2, Number(index)));\n  },\n};\n"

          p.write_text(s)
          PY

          node --check game.js
          NODE_NO_WARNINGS=1 node test-game.mjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/release-prepare.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js .github/workflows/release-prepare.yml
          git commit -m "feat: wire LAB-8 1.0 gameplay integration"
          git push origin HEAD:release/lab8-1.0
