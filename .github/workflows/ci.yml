name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in viewport.js levels.js campaign-core.js campaign-game.js game-v2.js world-rules.js spawn-patterns.js spawn-tuning.js bomb-enemy.js game.js audio.js pin.js settings.js leaderboard.js leaderboard-store.mjs server.mjs sw.js test-campaign.mjs test-runtime-v2.mjs test-game.mjs test-pin.mjs test-settings.mjs test-leaderboard.mjs test-leaderboard-ui.mjs test-server.mjs; do node --check "$file"; done
      - name: Verify cache migration and release URLs
        run: node test-cache.mjs
      - name: Run tests
        env:
          NODE_NO_WARNINGS: '1'
        run: |
          node test-pin.mjs
          node test-settings.mjs
          node test-leaderboard.mjs
          node test-leaderboard-ui.mjs
          node test-server.mjs
          node test-campaign.mjs
          node test-runtime-v2.mjs
          node test-game.mjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/lab8-browser" --no-save --package-lock=false playwright@1.51.1
          node "$RUNNER_TEMP/lab8-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Verify mobile viewport in Chromium
        run: NODE_PATH="$RUNNER_TEMP/lab8-browser/node_modules" node test-viewport.mjs
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"
      - name: Verify released version and cache
        run: |
          grep -q 'data-start-lives="3"' index.html
          grep -q 'data-start-lives="7"' index.html
          grep -q 'MAX_LIVES = 7' campaign-core.js
          grep -q 'orientation.*landscape' manifest.webmanifest
          grep -q 'display-mode:standalone' styles.css
          grep -q 'touch-action:pan-y' panels.css
          grep -q 'world-rules.js' index.html
          grep -q 'bomb-enemy.js' index.html
      - name: Verify required files
        run: |
          for file in index.html styles.css panels.css levels.js campaign-core.js campaign-game.js game-v2.js world-rules.js spawn-patterns.js spawn-tuning.js bomb-enemy.js game.js audio.js pin.js settings.js leaderboard.js leaderboard-store.mjs server.mjs test-campaign.mjs test-runtime-v2.mjs test-game.mjs test-pin.mjs test-settings.mjs test-leaderboard.mjs test-leaderboard-ui.mjs test-server.mjs sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png; do test -f "$file"; done
