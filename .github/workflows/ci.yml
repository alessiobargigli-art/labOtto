name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check sw.js

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Verify vertical slice version
        run: |
          grep -q 'VERTICAL SLICE 0.3' index.html
          grep -q "lab8-v0.3" sw.js

      - name: Verify required app shell files
        run: |
          test -f index.html
          test -f styles.css
          test -f game.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/apple-touch-icon.png
