<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#08131a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LAB-8" />
  <meta name="format-detection" content="telephone=no" />
  <title>LAB-8</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="titlebar">
      <div>
        <h1>LAB-8</h1>
        <p>Guido contro le provette del laboratorio orbitale.</p>
      </div>
      <div class="badge">VERTICAL SLICE 0.4</div>
    </header>

    <section class="game-frame" aria-label="LAB-8 game">
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="360" tabindex="0" aria-label="Area di gioco LAB-8"></canvas>
      </div>

      <div id="touchControls" class="touch-controls" aria-label="Controlli touch">
        <div class="touch-group touch-group--left" aria-label="Controlli azione">
          <button class="pixel-button pixel-button--jump" data-action="jump" aria-label="Salta">
            <span class="pixel-button__icon" aria-hidden="true">↑</span>
            <span class="pixel-button__label">SALTO</span>
          </button>
          <button class="pixel-button pixel-button--shoot" data-action="shoot" aria-label="Spara">
            <span class="pixel-button__icon" aria-hidden="true">●</span>
            <span class="pixel-button__label">SPARO</span>
          </button>
        </div>

        <div class="touch-group touch-group--right" aria-label="Controlli marcia">
          <button class="pixel-button pixel-button--gear" data-action="slower" aria-label="Diminuisci marcia">
            <span class="pixel-button__icon" aria-hidden="true">−</span>
            <span class="pixel-button__label">MARCIA</span>
          </button>
          <button class="pixel-button pixel-button--gear" data-action="faster" aria-label="Aumenta marcia">
            <span class="pixel-button__icon" aria-hidden="true">+</span>
            <span class="pixel-button__label">MARCIA</span>
          </button>
        </div>
      </div>
    </section>

    <section class="help">
      <strong>CONTROLLI</strong>
      <span>Salta: <kbd>Spazio</kbd> / <kbd>↑</kbd> / <kbd>W</kbd></span>
      <span>Spara: <kbd>X</kbd> / <kbd>F</kbd></span>
      <span>Marcia: <kbd>−</kbd> / <kbd>+</kbd></span>
      <span>Restart: <kbd>R</kbd> / <kbd>Invio</kbd></span>
    </section>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
