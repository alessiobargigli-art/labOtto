<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#08131a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LAB-8" />
  <meta name="format-detection" content="telephone=no" />
  <title>LAB-8</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="panels.css" />
</head>
<body>
  <main class="shell">
    <header class="titlebar">
      <div>
        <h1>LAB-8</h1>
        <p>Guido attraverso quattro mondi ostili.</p>
      </div>
      <div class="title-actions">
        <div class="badge">VERSIONE 2.0.2</div>
        <button id="forceRefresh" class="refresh-button" type="button" aria-label="Aggiorna LAB-8 all'ultima versione">↻ AGGIORNA</button>
        <button id="leaderboardButton" class="settings-button" type="button" aria-label="Classifica globale">★ TOP 15</button>
        <button id="settingsButton" class="settings-button" type="button" aria-label="Impostazioni gioco">⚙ SETUP</button>
        <button id="pinSettings" class="settings-button pin-legacy-button" type="button" aria-label="Impostazioni PIN" hidden>⚙ PIN</button>
      </div>
    </header>

    <section class="game-frame" aria-label="LAB-8 game">
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="360" tabindex="0" aria-label="Area di gioco LAB-8"></canvas>
        <canvas id="pinOverlay" width="960" height="360" hidden aria-label="Blocco PIN LAB-8" aria-hidden="true"></canvas>

        <section id="settingsOverlay" class="panel-overlay" hidden aria-label="Impostazioni LAB-8">
          <div class="pixel-panel settings-panel">
            <h2>LAB-8 // IMPOSTAZIONI</h2>
            <label class="pixel-field">NOME GIOCATORE
              <input id="playerName" maxlength="20" autocomplete="nickname" spellcheck="false" />
            </label>
            <div class="setting-block">
              <span>VELOCITÀ INIZIALE</span>
              <div class="speed-choice">
                <button type="button" data-start-speed="0">1 // LENTA</button>
                <button type="button" data-start-speed="1">2 // NORMALE</button>
                <button type="button" data-start-speed="2">3 // VELOCE</button>
              </div>
            </div>
            <div class="setting-block pin-setting-row">
              <div><span>PIN LOCALE</span><strong id="settingsPinStatus">PIN DISATTIVATO</strong></div>
              <button id="settingsPinAction" type="button">ATTIVA PIN</button>
            </div>
            <div class="panel-actions">
              <button id="settingsClose" type="button">ANNULLA</button>
              <button id="settingsSave" type="button" class="primary">SALVA</button>
            </div>
          </div>
        </section>

        <section id="leaderboardOverlay" class="panel-overlay" hidden aria-label="Classifica globale LAB-8">
          <div class="pixel-panel leaderboard-panel">
            <h2>LAB-8 // TOP 15</h2>
            <p id="leaderboardStatus">TOP 15 GLOBALE</p>
            <div class="leaderboard-head"><span>#</span><span>GIOCATORE</span><span>SCORE</span><span>DATA / ORA</span></div>
            <div id="leaderboardList" class="leaderboard-list"></div>
            <div class="panel-actions"><button id="leaderboardClose" type="button" class="primary">CHIUDI</button></div>
          </div>
        </section>

        <div id="leaderboardToast" class="leaderboard-toast" hidden></div>
      </div>

      <div id="touchControls" class="touch-controls" aria-label="Controlli touch">
        <div class="touch-group touch-group--left" aria-label="Controlli azione">
          <button class="pixel-button pixel-button--jump" data-action="jump" aria-label="Salta"><span class="pixel-button__icon" aria-hidden="true">↑</span><span class="pixel-button__label">SALTO</span></button>
          <button class="pixel-button pixel-button--shoot" data-action="shoot" aria-label="Spara"><span class="pixel-button__icon" aria-hidden="true">●</span><span class="pixel-button__label">SPARO</span></button>
        </div>
        <div class="touch-group touch-group--right" aria-label="Controlli marcia">
          <button class="pixel-button pixel-button--gear" data-action="slower" aria-label="Diminuisci marcia"><span class="pixel-button__icon" aria-hidden="true">−</span><span class="pixel-button__label">MARCIA</span></button>
          <button class="pixel-button pixel-button--gear" data-action="faster" aria-label="Aumenta marcia"><span class="pixel-button__icon" aria-hidden="true">+</span><span class="pixel-button__label">MARCIA</span></button>
        </div>
      </div>
    </section>

    <section class="help">
      <strong>CONTROLLI</strong>
      <span>Salta: <kbd>Spazio</kbd> / <kbd>↑</kbd> / <kbd>W</kbd></span>
      <span>Spara: <kbd>X</kbd> / <kbd>F</kbd></span>
      <span>Marcia: <kbd>−</kbd> / <kbd>+</kbd></span>
      <span>Restart: <kbd>R</kbd> / <kbd>Invio</kbd></span>
    </section>
  </main>

  <script>
    document.querySelector('#forceRefresh').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = '↻ AGGIORNO...';
      try {
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.getRegistration();
          if (registration) await registration.update();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter((key) => key.startsWith('lab8-')).map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.warn('LAB-8 aggiornamento forzato parziale:', error);
      }
      const url = new URL(window.location.href);
      url.searchParams.set('refresh', Date.now().toString());
      window.location.replace(url.toString());
    });
  </script>
  <script src="pin.js"></script>
  <script src="settings.js"></script>
  <script src="leaderboard.js"></script>
  <script src="levels.js"></script>
  <script src="campaign-core.js"></script>
  <script src="game-v2.js"></script>
  <script src="spawn-patterns.js"></script>
  <script src="spawn-tuning.js"></script>
  <script src="audio.js"></script>
</body>
</html>
